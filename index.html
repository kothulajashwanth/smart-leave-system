<!DOCTYPE html>
<html>

<head>
    <title>Smart Leave Permission System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: url("https://tech-mates2027.github.io/IRE.in/cmrtc%20hdbg.jpg") no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            top: 0;
            left: 0;
            z-index: -1;
        }

        h1 {
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00c6ff;
        }

        .container {
            width: 90%;
            max-width: 420px;
            margin: 10px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
        }

        button {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        .reject {
            background: red;
        }

        .hidden {
            display: none;
        }

        .role-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            padding: 14px 20px;
            margin: 10px 0;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
        }

        .role-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        #leaveLetter {
            background: white;
            color: black;
            border-radius: 15px;
            padding: 15px;
            display: none;
        }

        #notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00c6ff;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #000;
            display: none;
            font-weight: bold;
            z-index: 999;
        }
    </style>
</head>

<body>

    <h1>🎓 Leave Permission System (FAB FOUR 🚀)</h1>

    <div id="notification"></div>

    <!-- ROLE SELECTION (FIRST INTERFACE) -->
    <div class="container" id="roleSelection">
        <h2 style="text-align: center; margin-bottom: 15px;">👥 Select Role</h2>
        <button class="role-btn" onclick="openLogin('student')">👨‍🎓 Student</button>
        <button class="role-btn" onclick="openLogin('mentor')">👨‍🏫 Mentor</button>
        <button class="role-btn" onclick="openLogin('coordinator')">📋 Co-ordinator</button>
        <button class="role-btn" onclick="openLogin('hod')">🎓 HOD</button>
    </div>

    <!-- LOGIN -->
    <div class="container hidden" id="loginPage">
        <h2 id="loginTitle">🔐 Login</h2>
        <input type="text" id="username" placeholder="Username (Roll No for students)" onkeydown="if(event.key === 'Enter') login()">
        <input type="password" id="password" placeholder="Password (same as Roll No)" onkeydown="if(event.key === 'Enter') login()">
        <button onclick="login()">Login</button>
        <button class="btn-secondary" onclick="backToRoles()">⬅ Back to Roles</button>
    </div>

    <!-- STUDENT -->
    <div class="container hidden" id="studentForm">
        <h2>📝 Student Request</h2>
        <input type="text" id="studentName" placeholder="Name">
        <input type="text" id="rollNo" placeholder="Roll No">
        <input type="text" id="course" placeholder="Course">
        <textarea id="reason" placeholder="Reason"></textarea>
        <input type="date" id="startDate">
        <input type="date" id="endDate">
        <button onclick="submitRequest()">Submit Request</button>
        <h3 id="statusText"></h3>
        <button class="btn-secondary" onclick="logout()" style="margin-top: 15px;">⬅ Logout / Switch Role</button>
    </div>

    <!-- APPROVAL -->
    <div class="container hidden" id="approvalPanel">
        <h2 id="roleTitle"></h2>
        <div id="requestData"></div>
        <button class="btn-secondary" onclick="logout()" style="margin-top: 15px;">⬅ Logout / Switch Role</button>
    </div>

    <!-- LETTER -->
    <div class="container" id="leaveLetter">
        <h2>📄 Leave Letter</h2>
        <pre id="letterContent"></pre>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbtZlSXAeae2YyLuglqURGf8D3Xg-uiCs",
            authDomain: "fab-four.firebaseapp.com",
            projectId: "fab-four",
            storageBucket: "fab-four.firebasestorage.app",
            messagingSenderId: "690485073427",
            appId: "1:690485073427:web:bbc7b9b8be14e4590a11e6",
            measurementId: "G-3JNMN0RJE9"
        };

        window.firebaseReady = false;
        window.firebaseReadyPromise = new Promise((resolve) => {
            window.resolveFirebaseReady = resolve;
        });

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAnalytics = analytics;
        window.firebaseDb = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.firebaseReady = true;
        window.resolveFirebaseReady?.();
        console.log("Firebase initialized successfully");
    </script>

    <script>
        const users = {
            mentor: {
                username: "mentor",
                password: "123"
            },
            coordinator: {
                username: "co",
                password: "123"
            },
            hod: {
                username: "hod",
                password: "123"
            }
        };

        let selectedRole = "";
        let currentRole = "";
        let currentRoll = "";
        let requests = JSON.parse(localStorage.getItem("requests")) || [];

        function openLogin(role) {
            selectedRole = role;
            roleSelection.classList.add("hidden");
            loginPage.classList.remove("hidden");
            username.value = "";
            password.value = "";

            if (role === "student") {
                loginTitle.innerText = "👨‍🎓 Student Login";
                username.placeholder = "Username (Roll No)";
                password.placeholder = "Password (same as Roll No)";
            } else if (role === "mentor") {
                loginTitle.innerText = "👨‍🏫 Mentor Login";
                username.placeholder = "Username (mentor)";
                username.value = "mentor";
                password.placeholder = "Password (123)";
            } else if (role === "coordinator") {
                loginTitle.innerText = "📋 Co-ordinator Login";
                username.placeholder = "Username (co)";
                username.value = "co";
                password.placeholder = "Password (123)";
            } else if (role === "hod") {
                loginTitle.innerText = "🎓 HOD Login";
                username.placeholder = "Username (hod)";
                username.value = "hod";
                password.placeholder = "Password (123)";
            }
            password.focus();
        }

        function backToRoles() {
            loginPage.classList.add("hidden");
            roleSelection.classList.remove("hidden");
            username.value = "";
            password.value = "";
        }

        function logout() {
            currentRole = "";
            currentRoll = "";
            studentForm.classList.add("hidden");
            approvalPanel.classList.add("hidden");
            leaveLetter.style.display = "none";
            roleSelection.classList.remove("hidden");
        }

        function login() {
            let user = username.value.trim();
            let pass = password.value.trim();

            for (let role in users) {
                if (users[role].username === user && users[role].password === pass) {
                    currentRole = role;
                    loginPage.classList.add("hidden");
                    approvalPanel.classList.remove("hidden");
                    roleTitle.innerText = role.toUpperCase() + " PANEL";
                    loadRequests();
                    return;
                }
            }

            if (pass === user && user !== "") {
                currentRole = "student";
                currentRoll = user;
                loginPage.classList.add("hidden");
                studentForm.classList.remove("hidden");
                rollNo.value = user;
                showMyData();
                return;
            }

            alert("Invalid Login ❌");
        }

        function submitRequest() {
            let req = {
                id: Date.now(),
                studentName: studentName.value,
                rollNo: rollNo.value,
                course: course.value,
                reason: reason.value,
                startDate: startDate.value,
                endDate: endDate.value,
                approvals: {
                    mentor: null,
                    coordinator: null,
                    hod: null
                },
                letter: ""
            };

            currentRoll = rollNo.value;

            requests.push(req);
            save();
            showNotification("📨 Request Submitted!");
        }

        function loadRequests() {
            requestData.innerHTML = "";

            requests.forEach(r => {
                requestData.innerHTML += `
    <div style="border:1px solid white;padding:10px;margin:10px;border-radius:10px;">
      <b>${r.studentName}</b> (${r.rollNo})<br>
      ${r.reason}<br>
      ${r.startDate} → ${r.endDate}<br>
      <b>Status:</b> ${getStatus(r)}<br><br>

      <button onclick="approve(${r.id})">Approve</button>
      <button class="reject" onclick="reject(${r.id})">Reject</button>
    </div>`;
            });
        }

        function approve(id) {
            let r = requests.find(x => x.id === id);

            if (currentRole === "coordinator" && r.approvals.mentor !== true) {
                alert("Mentor approval required!");
                return;
            }
            if (currentRole === "hod" && r.approvals.coordinator !== true) {
                alert("Coordinator approval required!");
                return;
            }

            r.approvals[currentRole] = true;

            if (currentRole === "hod") {
                r.letter = generateLetter(r);
            }

            save();
            loadRequests();
            showNotification(currentRole.toUpperCase() + " Approved ✅");
        }

        function reject(id) {
            let r = requests.find(x => x.id === id);
            r.approvals[currentRole] = false;
            save();
            loadRequests();
            showNotification("❌ Rejected");
        }

        function getStatus(r) {
            if (Object.values(r.approvals).includes(false)) return "❌ Rejected";
            if (Object.values(r.approvals).every(v => v === true)) return "🎉 Approved";
            return "⏳ Pending";
        }

        function showMyData() {
            let my = requests.filter(x => x.rollNo === currentRoll);

            if (!my.length) {
                statusText.innerText = "No requests yet";
                return;
            }

            let last = my[my.length - 1];

            statusText.innerText = getStatus(last);

            if (last.letter) {
                leaveLetter.style.display = "block";
                letterContent.textContent = last.letter;
            }
        }

        setInterval(() => {
            if (currentRole === "student") {
                showMyData();
            }
        }, 3000);

        /* ✅ UPDATED LETTER FUNCTION */
        function generateLetter(r) {
            let today = new Date().toLocaleDateString();

            let start = new Date(r.startDate);
            let end = new Date(r.endDate);

            let durationText = "";

            if (r.startDate === r.endDate) {
                durationText = "Half Day Leave";
            } else {
                let diffTime = end - start;
                let days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                durationText = days + " Days Leave";
            }

            return `
To,
The Head of Department

Date: ${today}

Subject: Leave Application

I, ${r.studentName} (${r.rollNo}),
pursuing ${r.course},
request ${durationText} from ${r.startDate} to ${r.endDate}
due to ${r.reason}.

Approved by Mentor, Coordinator & HOD.

Yours sincerely,
${r.studentName}
`;
        }

        async function ensureFirebaseReady() {
            if (window.firebaseReady) return;
            await window.firebaseReadyPromise;
        }

        async function save() {
            localStorage.setItem("requests", JSON.stringify(requests));

            if (window.firebaseDb) {
                try {
                    await ensureFirebaseReady();
                    await window.setDoc(window.doc(window.firebaseDb, "leaveSystem", "requests"), { requests });
                } catch (error) {
                    console.error("Firebase save failed:", error);
                }
            }
        }

        async function loadFromFirebase() {
            if (!window.firebaseDb) return;

            try {
                await ensureFirebaseReady();
                const snapshot = await window.getDoc(window.doc(window.firebaseDb, "leaveSystem", "requests"));
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (Array.isArray(data.requests)) {
                        requests = data.requests;
                        localStorage.setItem("requests", JSON.stringify(requests));
                    }
                }
            } catch (error) {
                console.error("Firebase load failed:", error);
            }
        }

        function showNotification(message) {
            let box = document.getElementById("notification");
            box.innerText = message;
            box.style.display = "block";
            setTimeout(() => box.style.display = "none", 3000);
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadFromFirebase().then(() => {
                loadRequests();
                if (currentRole === "student") {
                    showMyData();
                }
            });
        });
    </script>
</body>

</html>
